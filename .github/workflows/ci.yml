name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned requirements
        run: pip install -r requirements.txt
      - name: Lint (max line length 95)
        run: flake8 src tests app
      - name: Unit tests
        run: pytest -q
