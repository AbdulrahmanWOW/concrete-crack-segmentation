# Shared settings used by every pipeline. Paths are relative to the repository root.
data:
  raw_images: data/raw/images
  raw_masks: data/raw/masks
  splits_dir: data/splits
  working_scale: 0.25        # 1/4 scale retained more crack detail than the 1/8 study
  mask_threshold: 127        # mask pixels > 127 are crack

split:
  seed: 42
  test_fraction: 0.30

experiments:
  log_file: experiments/log.csv
  figures_dir: experiments/figures
  results_dir: experiments/results

decision:
  inspect_if_crack_area_percent_above: null   # set on the development set
